name: Instrumented Tests

# Runs the on-device (`connectedDebugAndroidTest`) instrumented suites on a
# headless emulator so the Compose UI tests — which have never executed in CI
# before — gate every PR. Closes
# https://github.com/Ranzlappen/HardwareDash/issues/92.
#
# Scope: the Hilt-free, library/feature instrumented modules. The previously-
# dormant suites were audited screen-by-screen and their never-run assertions
# fixed (duplicate-text ambiguity from card-title vs ModuleCapability-name
# overlap; below-the-fold nodes needing performScrollTo; a collapsed
# GadgetExpandableCard body) and gated. Keep new suites gated the moment they
# land so they never rot again.
# NOTE: :feature:display is deferred — its GadgetSlider enabled/disabled
# assertions are ambiguous (the a11y label is a contentDescription on both the
# slider Row and the clickable value label), and getting the matcher right
# needs on-device semantics inspection we can't do without a local SDK.
#   * :core:ui                 — design-system component contracts (Modals, …)
#   * :core:data               — automation engine integration (rule → Room →
#                                gate → evaluate → dispatch; Batch F / F3)
#   * :feature:torch           — TorchScreenContent (stateless screen)
#   * :feature:vibration       — VibrationScreenContent (stateless screen)
#   * :feature:apps            — AppsScreenContent (stateless screen)
#   * :feature:sensors         — SensorsScreenContent (stateless screen)
#   * :feature:automation-ui   — AutomationScreenContent + rule editor (Batch H)
#   * :feature:battery         — BatteryScreenContent (stateless screen)
#   * :feature:storage         — StorageScreenContent (stateless screen)
#   * :feature:dashboard       — DashboardScreenContent (stateless screen)
#   * :feature:notification    — notification-channel inspector + builder
#   * :feature:usbdebug        — USB-debug status screen
#   * :feature:microphone      — extreme mic tools screen
#   * :feature:adbdebug        — ADB-debug status screen
#   * :feature:radios-cell     — cellular radio screen
#   * :feature:bugreport       — bug-report capture screen
#   * :feature:flipper         — flipper tools screen
#   * :feature:radios-subghz   — sub-GHz radio screen
# Only :app declares product flavors, so these modules use the unqualified
# `connectedDebugAndroidTest` task. A flavor/API-level matrix (and :app's own
# connected tests) can be layered on later if the need arises — kept to one
# config here to bound emulator runner cost.

on:
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'wiki/**'
      - '.gitignore'
      - '.gitattributes'
      - '.idea/**'

# Emulator runs are expensive; cancel a superseded run when new commits land.
concurrency:
  group: instrumented-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: connectedDebugAndroidTest (API 30 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Same Gradle caching layout as build-apk.yml / ci-refactor.yml.
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Hardware acceleration: the Linux runner exposes /dev/kvm, but the
      # default udev rules don't grant the runner user access. This is the
      # documented android-emulator-runner prerequisite on ubuntu-latest.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Do not cache the AVD/snapshot itself. The public API-30 emulator has
      # intermittently restored to a state where android-emulator-runner waits
      # until its boot timeout, so each CI attempt creates a clean AVD and only
      # relies on the retried system-image install below for download hardening.

      # The recurring CI flake was `sdkmanager` failing with "Error on ZipFile
      # unknown archive" while downloading the API-30 system image — a transient
      # corrupt/partial download that aborts the emulator-runner before any test
      # runs (job dies in ~100s with an orphaned adb). The image isn't
      # pre-present on ubuntu-latest, so it's fetched every run. Pre-install it
      # here with a 3-attempt retry that clears the partial download between
      # tries; a clean re-fetch nearly always succeeds. The emulator-runner's
      # own `sdkmanager --install` is idempotent, so once this leaves a valid
      # image in place that step is a no-op (no second download to flake on).
      - name: Pre-install system image (retry on corrupt download)
        env:
          SDK_PKG: "system-images;android-30;google_apis;x86_64"
        run: |
          set -u
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          # `sdkmanager` is NOT on PATH in a bare run step (the emulator-runner
          # action sets that up internally — the first attempt of this fix hit
          # "sdkmanager: command not found"), so resolve the binary explicitly:
          # the cmdline-tools install first, then PATH, then any copy under the
          # SDK root.
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(command -v sdkmanager || true)"
          fi
          if [ -z "$sdkmanager" ] || [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "$sdk_root" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$sdkmanager" ] || [ ! -x "$sdkmanager" ]; then
            echo "could not locate sdkmanager under $sdk_root"; exit 1
          fi
          echo "using sdkmanager at: $sdkmanager"
          for attempt in 1 2 3; do
            echo "::group::sdkmanager install attempt $attempt/3"
            if yes | "$sdkmanager" --install "$SDK_PKG" --channel=0; then
              echo "::endgroup::"
              echo "system image present after attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed — clearing partial download, retrying"
            rm -rf "$sdk_root/system-images/android-30" "$HOME/.android/cache" || true
            sleep $((attempt * 5))
          done
          echo "system image install failed after 3 attempts"
          exit 1

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-snapshot-load -no-snapshot-save -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Compose UI tests assert against a settled tree — animations off.
          disable-animations: true
          # Single line: android-emulator-runner's `script` input does not
          # reliably honor backslash-newline continuations (the `\` leaks
          # through as a literal Gradle task → "Task '\' not found").
          script: ./gradlew :core:ui:connectedDebugAndroidTest :core:data:connectedDebugAndroidTest :feature:torch:connectedDebugAndroidTest :feature:vibration:connectedDebugAndroidTest :feature:apps:connectedDebugAndroidTest :feature:sensors:connectedDebugAndroidTest :feature:automation-ui:connectedDebugAndroidTest :feature:battery:connectedDebugAndroidTest :feature:storage:connectedDebugAndroidTest :feature:dashboard:connectedDebugAndroidTest :feature:notification:connectedDebugAndroidTest :feature:usbdebug:connectedDebugAndroidTest :feature:microphone:connectedDebugAndroidTest :feature:adbdebug:connectedDebugAndroidTest :feature:radios-cell:connectedDebugAndroidTest :feature:bugreport:connectedDebugAndroidTest :feature:flipper:connectedDebugAndroidTest :feature:radios-subghz:connectedDebugAndroidTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            **/build/reports/androidTests/connected/**
            **/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Test summary
        if: always()
        run: |
          {
            echo "## Instrumented tests (API 30 emulator)"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ **connectedDebugAndroidTest passed** for :core:ui, :core:data and the gated feature suites (torch, vibration, apps, sensors, automation-ui, battery, storage, dashboard, notification, usbdebug, microphone, adbdebug, radios-cell, bugreport, flipper, radios-subghz)."
            else
              echo "❌ **Instrumented tests failed.** See the uploaded \`instrumented-test-reports\` artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
