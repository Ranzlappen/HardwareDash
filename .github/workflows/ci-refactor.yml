name: CI (claude/refactor-2026)

# Fast-feedback CI. Lightweight companion to the full Build Variants matrix
# in build-apk.yml — this workflow skips signing, AAB bundling, and release
# uploads, and just exercises both APK flavors in debug so a Kotlin/Gradle
# regression surfaces quickly on every pull request.
#
# Why both workflows?
#   * build-apk.yml is the production matrix: signed release APKs (standard +
#     rooted), signed AAB, leak gate, rooted libsu assertion. Slow but
#     comprehensive. Runs on pushes to main + manual dispatch only.
#   * ci-refactor.yml (this file) is the iteration loop: assemble debug APKs
#     for both flavors and exit. Quick to fail on a typo in a
#     `build.gradle.kts` or a `*.kt`, where the matrix would spend several
#     more minutes on signing + asset gates before reporting the same
#     root cause. Runs on every PR regardless of target branch, and on
#     pushes to `claude/v3-**` so each v3 batch gets a compile verdict
#     without opening a PR (the PR-comment steps below are guarded by
#     `github.event_name == 'pull_request'`).

on:
  push:
    branches:
      - 'claude/v3-**'
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'wiki/**'
      - '.gitignore'
      - '.gitattributes'
      - '.idea/**'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'wiki/**'
      - '.gitignore'
      - '.gitattributes'
      - '.idea/**'

# A newer push to the same branch/PR supersedes the running build.
concurrency:
  group: ci-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JVM unit tests for the modules that carry pure-logic correctness
  # (serialization wire-format pins, the automation rule model/evaluator).
  # Scoped to an explicit module list rather than a repo-wide
  # `testDebugUnitTest` so pre-existing never-run-in-CI test debt in other
  # modules can't block unrelated PRs; grow the list as modules gain tests
  # that must gate.
  unit-tests:
    name: JVM unit tests (core modules)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: |
          ./gradlew \
            :core:automation:testDebugUnitTest \
            :core:data:testDebugUnitTest \
            :core:designsystem:testDebugUnitTest \
            :core:hardware:testDebugUnitTest \
            :core:monitoring:testDebugUnitTest \
            :core:navigation:testDebugUnitTest \
            :core:widgetkit:testDebugUnitTest \
            :feature:adbdebug:testDebugUnitTest \
            :feature:apps:testDebugUnitTest \
            :feature:apps-rooted:testDebugUnitTest \
            :feature:audio:testDebugUnitTest \
            :feature:automation:testDebugUnitTest \
            :feature:battery:testDebugUnitTest \
            :feature:camera:testDebugUnitTest \
            :feature:bugreport-rooted:testDebugUnitTest \
            :feature:dashboard:testDebugUnitTest \
            :feature:diagnostics:testDebugUnitTest \
            :feature:display:testDebugUnitTest \
            :feature:flipper:testDebugUnitTest \
            :feature:flipper-rooted:testDebugUnitTest \
            :feature:gps:testDebugUnitTest \
            :feature:lock-rooted:testDebugUnitTest \
            :feature:logbook:testDebugUnitTest \
            :feature:metricwidget:testDebugUnitTest \
            :feature:microphone:testDebugUnitTest \
            :feature:notification:testDebugUnitTest \
            :feature:radios-cell:testDebugUnitTest \
            :feature:radios-subghz:testDebugUnitTest \
            :feature:radios-wifi-rooted:testDebugUnitTest \
            :feature:sensors:testDebugUnitTest \
            :feature:storage:testDebugUnitTest \
            :feature:torch:testDebugUnitTest \
            :feature:usbdebug:testDebugUnitTest \
            :feature:vibration:testDebugUnitTest \
            :feature:youtubedownloader:testDebugUnitTest \
            --stacktrace

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            core/*/build/reports/tests/
            feature/*/build/reports/tests/
          retention-days: 7

  build:
    name: Assemble both flavors (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # APK-size delta step downloads the latest main-branch baseline
      # artifact from build-apk.yml runs and writes a sticky PR comment.
      actions: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Same caching layout used by build-apk.yml — keys off the Gradle
          # wrapper distribution URL, the version catalog, and every
          # build.gradle.kts in the project. Cache hits skip the
          # ~30s Gradle distribution download.
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Seed JitPack Maven Local cache
        uses: ./.github/actions/seed-jitpack-cache

      # Both assemble tasks in one Gradle invocation so the configuration
      # phase only runs once. -PenableLsposedModule=true mirrors the
      # production rooted CI leg and causes the lsposed-module project to
      # be included + its release APK staged into
      # app/src/rooted/assets/. Standard variant is unaffected by the
      # property (the asset-copy task only attaches to the rooted variant's
      # preBuild).
      # Pushes to claude/v3-** produce phone-test APKs, so they must install
      # OVER the production build already on the phone: sign with the
      # production keystore (same secrets as build-apk.yml) and use a
      # versionCode above every main release (1000 + run number; main's
      # build-apk.yml starts at 3000 + run number, so a later release still
      # updates over a test build). PR runs keep the throwaway debug key.
      - name: Assemble standard + rooted debug APKs
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          EXTRA=()
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/Gadget-release.jks"
            echo "v3 test build: release-key signed, versionCode $(( (1000 + ${{ github.run_number }}) * 10 ))"
            EXTRA=(
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/Gadget-release.jks"
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD"
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS"
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
              -PCI_VERSION_CODE=$((1000 + ${{ github.run_number }}))
              -PCI_VERSION_NAME=3.0-dev.${{ github.run_number }}
            )
          fi
          ./gradlew \
            -PenableLsposedModule=true \
            "${EXTRA[@]}" \
            assembleStandardDebug \
            assembleRootedDebug \
            --stacktrace

      # v3 smoke testing happens on real phones (no local tooling), so pushes
      # to claude/v3-** publish both debug APKs as a downloadable artifact:
      # standard → the daily (unrooted) phone, rooted → the rooted test phone.
      # Short retention keeps CI storage small; PR runs skip it.
      # Prints what the phone's installer will compare: package, versionCode,
      # signer. On pushes the test APKs must carry the release certificate
      # (the one v1.0.231 was signed with) or they cannot update the
      # installed app - fail loudly instead of shipping an uninstallable APK.
      - name: Check debug APK identity
        if: github.event_name == 'push'
        env:
          RELEASE_CERT_SHA256: 2341b7005d15352401b1f07c6bf389fce513390392d8c03fa8ab7988ef5d1eab
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          status=0
          for apk in $(find app/build/outputs/apk -name '*.apk'); do
            echo "== $apk"
            "$BT/aapt2" dump badging "$apk" | head -1
            certs=$("$BT/apksigner" verify --print-certs "$apk")
            echo "$certs" | grep -E "SHA-256|DN"
            if ! echo "$certs" | grep -qi "SHA-256 digest: $RELEASE_CERT_SHA256"; then
              echo "::error file=$apk::not signed with the release certificate"
              status=1
            fi
          done
          exit $status

      - name: Upload debug APKs (v3 branch pushes)
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: gadget-debug-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/standard/debug/*.apk
            app/build/outputs/apk/rooted/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      # ─── APK-size delta vs main (standard-debug) ─────────────────────
      # Computes the size of the PR's standard-debug APK, downloads the
      # latest main-branch standard-debug APK from build-apk.yml as the
      # baseline, and publishes the delta to the PR Summary + a sticky
      # PR comment. The comment carries a hidden marker so subsequent
      # runs update it in place instead of stacking new comments. If the
      # baseline is unavailable (no recent main run, retention expired),
      # the step still prints the absolute PR size so reviewers see a
      # number.
      - name: Compute APK-size delta vs main
        if: success() && github.event_name == 'pull_request'
        id: apk_size
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PR_APK=$(find app/build/outputs/apk/standard/debug -name "*.apk" -print -quit || true)
          if [ -z "$PR_APK" ]; then
            echo "No standard debug APK found — skipping size delta."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_BYTES=$(stat -c%s "$PR_APK")
          echo "pr_bytes=$PR_BYTES" >> "$GITHUB_OUTPUT"

          # Find the most recent successful build-apk.yml run on main.
          LATEST_RUN=$(gh run list \
              --workflow=build-apk.yml \
              --branch=main \
              --status=success \
              --limit=1 \
              --json=databaseId \
              --jq='.[0].databaseId // empty' \
              --repo "$GITHUB_REPOSITORY")

          MAIN_BYTES=""
          if [ -n "$LATEST_RUN" ]; then
            mkdir -p /tmp/main-baseline
            if gh run download "$LATEST_RUN" \
                --name standard-debug-apk \
                --dir /tmp/main-baseline \
                --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
              MAIN_APK=$(find /tmp/main-baseline -name "*.apk" -print -quit || true)
              if [ -n "$MAIN_APK" ]; then
                MAIN_BYTES=$(stat -c%s "$MAIN_APK")
              fi
            fi
          fi
          echo "main_bytes=$MAIN_BYTES" >> "$GITHUB_OUTPUT"
          echo "main_run=$LATEST_RUN" >> "$GITHUB_OUTPUT"

      - name: Post APK-size delta PR comment
        if: success() && github.event_name == 'pull_request' && steps.apk_size.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          PR_BYTES: ${{ steps.apk_size.outputs.pr_bytes }}
          MAIN_BYTES: ${{ steps.apk_size.outputs.main_bytes }}
          MAIN_RUN: ${{ steps.apk_size.outputs.main_run }}
        with:
          script: |
            const marker = '<!-- apk-size-delta -->';
            const prBytes = Number(process.env.PR_BYTES);
            const mainBytesRaw = process.env.MAIN_BYTES;
            const mainBytes = mainBytesRaw ? Number(mainBytesRaw) : null;
            const fmt = (b) => `${(b / 1024 / 1024).toFixed(2)} MB`;
            const sign = (n) => (n > 0 ? '+' : n < 0 ? '-' : '');
            let body = `${marker}\n📦 **standard-debug APK** — ${fmt(prBytes)} (${prBytes.toLocaleString()} B)`;
            if (mainBytes != null) {
              const delta = prBytes - mainBytes;
              const deltaAbs = Math.abs(delta);
              const pct = ((delta / mainBytes) * 100).toFixed(2);
              const arrow = delta > 0 ? '🔺' : delta < 0 ? '🔻' : '➖';
              body += `\nΔ vs \`main\` baseline (${fmt(mainBytes)}): ${arrow} **${sign(delta)}${fmt(deltaAbs)}** (${sign(delta)}${deltaAbs.toLocaleString()} B, ${pct}%)`;
              body += `\n_baseline: build-apk.yml run #${process.env.MAIN_RUN}_`;
            } else {
              body += `\n_main-branch baseline unavailable (no recent successful build-apk.yml run found, or artifact retention expired)._`;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # Surface the result in the workflow Summary tab so the PR check
      # status is unambiguous even before opening the run logs.
      - name: Build summary
        if: always()
        run: |
          {
            echo "## CI (claude/refactor-2026)"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ **Both flavors built successfully.**"
              echo ""
              echo "Outputs:"
              find app/build/outputs/apk -name '*.apk' -printf '  - `%p` (%s bytes)\n' 2>/dev/null || true
            else
              echo "❌ **Build failed.** See the step logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
