name: CI (claude/refactor-2026)

# Fast-feedback CI. Lightweight companion to the full Build Variants matrix
# in build-apk.yml — this workflow skips signing, AAB bundling, and release
# uploads, and just exercises both APK flavors in debug so a Kotlin/Gradle
# regression surfaces quickly on every pull request.
#
# Why both workflows?
#   * build-apk.yml is the production matrix: signed release APKs (standard +
#     rooted), signed AAB, leak gate, rooted libsu assertion. Slow but
#     comprehensive. Runs on pushes to main + manual dispatch only.
#   * ci-refactor.yml (this file) is the iteration loop: assemble debug APKs
#     for both flavors and exit. Quick to fail on a typo in a
#     `build.gradle.kts` or a `*.kt`, where the matrix would spend several
#     more minutes on signing + asset gates before reporting the same
#     root cause. Runs on every PR regardless of target branch.

on:
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'wiki/**'
      - '.gitignore'
      - '.gitattributes'
      - '.idea/**'

jobs:
  # JVM unit tests for the modules that carry pure-logic correctness
  # (serialization wire-format pins, the automation rule model/evaluator).
  # Scoped to an explicit module list rather than a repo-wide
  # `testDebugUnitTest` so pre-existing never-run-in-CI test debt in other
  # modules can't block unrelated PRs; grow the list as modules gain tests
  # that must gate.
  unit-tests:
    name: JVM unit tests (core modules)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: |
          ./gradlew \
            :core:automation:testDebugUnitTest \
            :core:data:testDebugUnitTest \
            :core:hardware:testDebugUnitTest \
            :core:widgetkit:testDebugUnitTest \
            --stacktrace

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            core/automation/build/reports/tests/
            core/data/build/reports/tests/
            core/hardware/build/reports/tests/
            core/widgetkit/build/reports/tests/
          retention-days: 7

  build:
    name: Assemble both flavors (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # APK-size delta step downloads the latest main-branch baseline
      # artifact from build-apk.yml runs and writes a sticky PR comment.
      actions: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Same caching layout used by build-apk.yml — keys off the Gradle
          # wrapper distribution URL, the version catalog, and every
          # build.gradle.kts in the project. Cache hits skip the
          # ~30s Gradle distribution download.
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Both assemble tasks in one Gradle invocation so the configuration
      # phase only runs once. -PenableLsposedModule=true mirrors the
      # production rooted CI leg and causes the lsposed-module project to
      # be included + its release APK staged into
      # app/src/rooted/assets/. Standard variant is unaffected by the
      # property (the asset-copy task only attaches to the rooted variant's
      # preBuild).
      - name: Assemble standard + rooted debug APKs
        run: |
          ./gradlew \
            -PenableLsposedModule=true \
            assembleStandardDebug \
            assembleRootedDebug \
            --stacktrace

      # ─── APK-size delta vs main (standard-debug) ─────────────────────
      # Computes the size of the PR's standard-debug APK, downloads the
      # latest main-branch standard-debug APK from build-apk.yml as the
      # baseline, and publishes the delta to the PR Summary + a sticky
      # PR comment. The comment carries a hidden marker so subsequent
      # runs update it in place instead of stacking new comments. If the
      # baseline is unavailable (no recent main run, retention expired),
      # the step still prints the absolute PR size so reviewers see a
      # number.
      - name: Compute APK-size delta vs main
        if: success() && github.event_name == 'pull_request'
        id: apk_size
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PR_APK=$(find app/build/outputs/apk/standard/debug -name "*.apk" -print -quit || true)
          if [ -z "$PR_APK" ]; then
            echo "No standard debug APK found — skipping size delta."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_BYTES=$(stat -c%s "$PR_APK")
          echo "pr_bytes=$PR_BYTES" >> "$GITHUB_OUTPUT"

          # Find the most recent successful build-apk.yml run on main.
          LATEST_RUN=$(gh run list \
              --workflow=build-apk.yml \
              --branch=main \
              --status=success \
              --limit=1 \
              --json=databaseId \
              --jq='.[0].databaseId // empty' \
              --repo "$GITHUB_REPOSITORY")

          MAIN_BYTES=""
          if [ -n "$LATEST_RUN" ]; then
            mkdir -p /tmp/main-baseline
            if gh run download "$LATEST_RUN" \
                --name standard-debug-apk \
                --dir /tmp/main-baseline \
                --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
              MAIN_APK=$(find /tmp/main-baseline -name "*.apk" -print -quit || true)
              if [ -n "$MAIN_APK" ]; then
                MAIN_BYTES=$(stat -c%s "$MAIN_APK")
              fi
            fi
          fi
          echo "main_bytes=$MAIN_BYTES" >> "$GITHUB_OUTPUT"
          echo "main_run=$LATEST_RUN" >> "$GITHUB_OUTPUT"

      - name: Post APK-size delta PR comment
        if: success() && github.event_name == 'pull_request' && steps.apk_size.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          PR_BYTES: ${{ steps.apk_size.outputs.pr_bytes }}
          MAIN_BYTES: ${{ steps.apk_size.outputs.main_bytes }}
          MAIN_RUN: ${{ steps.apk_size.outputs.main_run }}
        with:
          script: |
            const marker = '<!-- apk-size-delta -->';
            const prBytes = Number(process.env.PR_BYTES);
            const mainBytesRaw = process.env.MAIN_BYTES;
            const mainBytes = mainBytesRaw ? Number(mainBytesRaw) : null;
            const fmt = (b) => `${(b / 1024 / 1024).toFixed(2)} MB`;
            const sign = (n) => (n > 0 ? '+' : n < 0 ? '-' : '');
            let body = `${marker}\n📦 **standard-debug APK** — ${fmt(prBytes)} (${prBytes.toLocaleString()} B)`;
            if (mainBytes != null) {
              const delta = prBytes - mainBytes;
              const deltaAbs = Math.abs(delta);
              const pct = ((delta / mainBytes) * 100).toFixed(2);
              const arrow = delta > 0 ? '🔺' : delta < 0 ? '🔻' : '➖';
              body += `\nΔ vs \`main\` baseline (${fmt(mainBytes)}): ${arrow} **${sign(delta)}${fmt(deltaAbs)}** (${sign(delta)}${deltaAbs.toLocaleString()} B, ${pct}%)`;
              body += `\n_baseline: build-apk.yml run #${process.env.MAIN_RUN}_`;
            } else {
              body += `\n_main-branch baseline unavailable (no recent successful build-apk.yml run found, or artifact retention expired)._`;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # Surface the result in the workflow Summary tab so the PR check
      # status is unambiguous even before opening the run logs.
      - name: Build summary
        if: always()
        run: |
          {
            echo "## CI (claude/refactor-2026)"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ **Both flavors built successfully.**"
              echo ""
              echo "Outputs:"
              find app/build/outputs/apk -name '*.apk' -printf '  - `%p` (%s bytes)\n' 2>/dev/null || true
            else
              echo "❌ **Build failed.** See the step logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
