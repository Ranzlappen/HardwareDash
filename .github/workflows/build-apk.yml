name: Build Variants

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - '.gitattributes'
      - '.idea/**'
      - 'docs/**'
      - 'app/src/test/**'
      - 'app/src/androidTest/**'

# A single workflow with a matrix over (flavor, buildType). Each leg is
# independent: a rooted-only compile failure cannot block the standard APK,
# and vice versa. Source-set scoping (src/standard/ vs src/rooted/) is
# enforced by AGP, NOT by deleting files in CI — never `rm -rf src/rooted/`
# from this workflow, it would race with the Gradle build cache.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: standard
            buildType: debug
            assembleTask: assembleStandardDebug
            outputDir: app/build/outputs/apk/standard/debug
            artifactName: standard-debug
            needsSigning: false
          - flavor: standard
            buildType: release
            assembleTask: "assembleStandardRelease bundleStandardRelease"
            outputDir: app/build/outputs/apk/standard/release
            bundleDir: app/build/outputs/bundle/standardRelease
            artifactName: standard-release
            needsSigning: true
          - flavor: rooted
            buildType: debug
            assembleTask: assembleRootedDebug
            outputDir: app/build/outputs/apk/rooted/debug
            artifactName: rooted-debug
            needsSigning: false
            extraGradleProps: "-PenableLsposedModule=true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode Keystore
        if: matrix.needsSigning
        run: echo "${{ secrets.KEYSTORE }}" | base64 -d > Gadget-release.jks

      - name: Prepare build metadata
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "BUILD_COMMIT=${{ github.sha }}" >> $GITHUB_ENV
          echo "BUILD_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "BUILD_AUTHOR=${{ github.actor }}" >> $GITHUB_ENV
          echo "APP_DESCRIPTION=Gadget — monitor and control device sensors, camera, audio, and more" >> $GITHUB_ENV

      # Signed release builds (standard-release only in this workflow).
      - name: Build signed release (${{ matrix.flavor }})
        if: matrix.needsSigning
        run: |
          ./gradlew ${{ matrix.assembleTask }} \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/Gadget-release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -PCI_VERSION_CODE=${{ env.VERSION_CODE }} \
            -PCI_VERSION_NAME=${{ env.VERSION_NAME }} \
            -PBUILD_AUTHOR="${{ env.BUILD_AUTHOR }}" \
            -PBUILD_DATE="${{ env.BUILD_DATE }}" \
            -PBUILD_COMMIT=${{ env.BUILD_COMMIT }} \
            -PBUILD_BRANCH=${{ env.BUILD_BRANCH }} \
            -PAPP_DESCRIPTION="${{ env.APP_DESCRIPTION }}"

      # Debug builds — AGP-managed debug keystore, no signing properties needed.
      - name: Build debug (${{ matrix.flavor }})
        if: ${{ !matrix.needsSigning }}
        run: |
          ./gradlew ${{ matrix.assembleTask }} \
            -PCI_VERSION_CODE=${{ env.VERSION_CODE }} \
            -PCI_VERSION_NAME=${{ env.VERSION_NAME }} \
            -PBUILD_AUTHOR="${{ env.BUILD_AUTHOR }}" \
            -PBUILD_DATE="${{ env.BUILD_DATE }}" \
            -PBUILD_COMMIT=${{ env.BUILD_COMMIT }} \
            -PBUILD_BRANCH=${{ env.BUILD_BRANCH }} \
            -PAPP_DESCRIPTION="${{ env.APP_DESCRIPTION }}" \
            ${{ matrix.extraGradleProps }}

      # ─── Standard-APK leakage assertion ──────────────────────────────────
      # Belt-and-suspenders check that the standard APK does not bundle any
      # rooted assets, libsu strings, the LSPosed module, or root-tier
      # permissions. Source-set scoping in AGP makes this impossible by
      # construction, but this step catches accidents (e.g. someone moves
      # a file from src/rooted/ to src/main/). On hit, the offending
      # strings/assets/permissions are printed and the step emits a
      # ::error:: annotation so the failure surfaces inline on the PR diff.
      #
      # Implementation note: dex and AndroidManifest.xml are extracted via
      # `unzip -p` and inspected with `strings`. We deliberately AVOID
      # `aapt dump permissions` here — its path is not stable across
      # GitHub-hosted runner images and silent fail-open was the bug that
      # an earlier version of this gate shipped with.
      - name: Assert standard APK has no rooted leakage
        if: matrix.flavor == 'standard'
        run: |
          set -euo pipefail
          APK=$(find ${{ matrix.outputDir }} -name "*.apk" -print -quit)
          test -n "$APK" || { echo "::error::No standard APK produced in ${{ matrix.outputDir }}"; exit 1; }
          echo "Inspecting: $APK"

          fail() { echo "::error::$1"; exit 1; }

          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT

          # Extract every dex (matched by archive-internal glob) plus the
          # binary AndroidManifest.xml. If either comes back empty, the APK
          # is malformed or unzip is not behaving — bail loudly rather than
          # passing the gate by accident.
          unzip -p "$APK" '*.dex' > "$WORK/dexes.bin" 2>/dev/null || true
          test -s "$WORK/dexes.bin" || fail "Could not extract any dex from $APK"

          unzip -p "$APK" AndroidManifest.xml > "$WORK/manifest.bin" 2>/dev/null || true
          test -s "$WORK/manifest.bin" || fail "Could not extract AndroidManifest.xml from $APK"

          # 1. No su-related strings in any dex.
          #
          # Pattern is intentionally PRECISE: bare `magisk` and `superuser`
          # would false-positive on the shared `RootProvider$Magisk` sealed-
          # class variant (whose abstraction lives in src/main/ with no
          # behavior in the standard flavor) and on cosmetic localization
          # strings that name Magisk/KernelSU as root managers. The actual
          # libsu/superuser integration always carries one of these
          # unambiguous markers in its class signatures or strings.
          #
          # Additional tokens beyond the libsu/topjohnwu set:
          #   - me\.weishu\.kernelsu, me\.bmax\.apatch — fully-qualified
          #     KernelSU / APatch package names referenced by
          #     `KernelSuProviderProbe` / `ApatchProviderProbe` in
          #     src/rooted/. Qualified so they cannot collide with the
          #     shared `RootProvider$KernelSu` / `$APatch` variants.
          #   - org\.lsposed\. — qualified with a trailing dot so it
          #     matches LSPosed framework package paths but not the
          #     cosmetic "LSPosed framework"/"LSPosed module" UI strings.
          #   - /data/adb/(magisk|modules|ksu) — root-mod sysfs paths
          #     referenced by rooted controllers/probes; sufficiently
          #     specific to avoid false-positives.
          HITS=$(strings -a -n 6 "$WORK/dexes.bin" \
            | grep -iE 'topjohnwu|libsu|/system/(bin|xbin)/su|chainfire|hiddenapibypass|me\.weishu\.kernelsu|me\.bmax\.apatch|org\.lsposed\.|/data/adb/(magisk|modules|ksu)' \
            | sort -u || true)
          if [ -n "$HITS" ]; then
            echo "Standard APK contains rooted strings:"
            echo "$HITS"
            fail "Standard APK contains rooted strings (see above)"
          fi

          # 2. No rooted asset filenames bundled inside the APK. Bare
          #    `kernelsu`/`apatch` tokens are safe here because this
          #    matcher consumes APK *entry filenames* only — class names
          #    never feed in — and no standard-flavor asset uses those
          #    strings. `/ksu/` is a separate alternative because the
          #    existing `/su/` literal does not substring-match `/ksu/`.
          ASSETS=$(unzip -l "$APK" | awk '{print $NF}' \
            | grep -iE 'lsposed|magisk|spoofer|\.magisk\.|/su/|/ksu/|kernelsu|apatch' || true)
          if [ -n "$ASSETS" ]; then
            echo "Standard APK contains rooted assets:"
            echo "$ASSETS"
            fail "Standard APK contains rooted assets (see above)"
          fi

          # 3. No root-tier permissions. The binary AndroidManifest.xml may
          #    store its string pool as either UTF-8 or UTF-16 LE depending
          #    on AAPT2's encoding choice. Default `strings` only catches
          #    contiguous 7-bit / UTF-8 runs, so we additionally pipe the
          #    blob through `tr -d '\0' | strings` (which collapses any
          #    UTF-16-style nulls and surfaces the underlying ASCII chars)
          #    and run a native UTF-16-LE extraction. Combined, these three
          #    passes catch the permission name regardless of how AAPT2
          #    chose to encode the pool.
          {
            strings -a -n 8 "$WORK/manifest.bin"
            tr -d '\0' < "$WORK/manifest.bin" | strings -a -n 8
            strings -a -e l -n 8 "$WORK/manifest.bin"
          } > "$WORK/manifest.txt"
          echo "Manifest text extraction: $(wc -l < "$WORK/manifest.txt") lines"

          PERMS=$(grep -iE 'WRITE_SECURE_SETTINGS|MOUNT_UNMOUNT|INSTALL_PACKAGES|DELETE_PACKAGES|READ_LOGS|MANAGE_USERS|CHANGE_CONFIGURATION|MASTER_CLEAR|REBOOT|ACCESS_SUPERUSER' "$WORK/manifest.txt" \
            | sort -u || true)
          if [ -n "$PERMS" ]; then
            echo "Standard APK declares root-tier permissions:"
            echo "$PERMS"
            fail "Standard APK declares root-tier permissions (see above)"
          fi

          echo "✅ Standard APK clean — no rooted leakage detected"

      # ─── Rooted-APK asset inventory (positive verification) ─────────────
      # The leak gate above is a *negative* check: it asserts the standard
      # APK does NOT contain rooted assets. The rooted leg deserves the
      # *positive* counterpart — assert that `assets/lsposed-spoofer.apk`
      # IS present, proving the conditional Gradle wiring at
      # `app/build.gradle:217-235` actually copied the LSPosed module's
      # release APK in. Output is short and lives in the GitHub Actions
      # log so it's mobile-readable on the phone you're testing on.
      - name: Inventory rooted APK assets
        if: matrix.flavor == 'rooted'
        run: |
          set -euo pipefail
          APK=$(find ${{ matrix.outputDir }} -name "*.apk" -print -quit)
          test -n "$APK" || { echo "::error::No rooted APK produced in ${{ matrix.outputDir }}"; exit 1; }
          echo "Rooted APK: $APK"
          echo "Bundled asset/*.apk and lsposed-related entries:"
          unzip -l "$APK" \
            | awk '$NF ~ /^assets\/.*\.apk$/ || tolower($NF) ~ /lsposed|spoofer/ {print "  "$NF" ("$1" bytes)"}' \
            || true

      # ─── Rooted-APK libsu presence assertion ────────────────────────────
      # Defense-in-depth twin to the standard-APK negative gate: if the
      # rooted source set silently shipped empty (e.g. a Gradle config
      # regression scoped src/rooted/ wrong, or a refactor accidentally
      # moved libsu deps to `implementation` and they were then stripped
      # from rooted by an `exclude`), the rooted APK would build green
      # but lack any root capability. Catch that here.
      - name: Assert rooted APK contains expected libsu signature
        if: matrix.flavor == 'rooted'
        run: |
          set -euo pipefail
          APK=$(find ${{ matrix.outputDir }} -name "*.apk" -print -quit)
          test -n "$APK" || { echo "::error::No rooted APK produced in ${{ matrix.outputDir }}"; exit 1; }
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          unzip -p "$APK" '*.dex' > "$WORK/dexes.bin" 2>/dev/null || true
          test -s "$WORK/dexes.bin" || { echo "::error::Could not extract dex from rooted APK"; exit 1; }
          strings -a -n 6 "$WORK/dexes.bin" \
            | grep -qiE 'topjohnwu|libsu' \
            || { echo "::error::Rooted APK missing libsu — rooted source set may be broken"; exit 1; }
          echo "✅ Rooted APK contains libsu signature"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}-apk
          path: ${{ matrix.outputDir }}/*.apk

      # AGP names AAB outputs `app-{flavor}-{buildType}.aab` and the
      # `applicationVariants.all { variant.outputs ... }` rename in
      # app/build.gradle only affects APKs, not bundles. Rename here so
      # the file matches the `Gadget-{flavor}-v{version}-{buildType}` style
      # the release body advertises.
      - name: Rename AAB to Gadget-standard naming
        if: matrix.flavor == 'standard' && matrix.buildType == 'release'
        run: |
          set -euo pipefail
          SRC=$(find ${{ matrix.bundleDir }} -name "*.aab" -print -quit)
          test -n "$SRC" || { echo "::error::No AAB found in ${{ matrix.bundleDir }}"; exit 1; }
          DEST="${{ matrix.bundleDir }}/Gadget-standard-v${VERSION_NAME}-release.aab"
          mv "$SRC" "$DEST"
          echo "Renamed: $SRC -> $DEST"

      - name: Upload AAB artifact (Play Store)
        if: matrix.flavor == 'standard' && matrix.buildType == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}-aab
          path: ${{ matrix.bundleDir }}/*.aab

  # ─── Combined GitHub Release (all four build outputs in one tag) ───────
  # Runs only after every matrix leg succeeds and only on main. Pulls the
  # uploaded artifacts from this workflow run and attaches them to a single
  # `vX.Y.Z` release: standard-debug.apk, standard-release.apk + .aab, and
  # rooted-debug.apk. This replaces the per-matrix-leg release attach,
  # which could only see its own leg's outputs.
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List downloaded artifacts (diagnostic)
        run: |
          echo "Artifact tree:"
          find artifacts/ -type f -printf '  %p (%s bytes)\n'

      - name: Create GitHub Release with all four builds
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Gadget v1.0.${{ github.run_number }}
          body: |
            **Build:** #${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Author:** ${{ github.actor }}

            ## Downloads

            All four build outputs from this CI run, attached to one release:

            - `Gadget-standard-v1.0.${{ github.run_number }}-debug.apk` — non-rooted **debug** build (Timber logs, Compose tooling). Sideload-friendly for testing.
            - `Gadget-standard-v1.0.${{ github.run_number }}-release.apk` — non-rooted **release** build. R8-minified, signed.
            - `Gadget-standard-v1.0.${{ github.run_number }}-release.aab` — Play Store bundle for the standard flavor.
            - `Gadget-rooted-v1.0.${{ github.run_number }}-root-debug.apk` — **rooted** debug build. Requires Magisk / KernelSU / APatch on device.

            Standard and rooted APKs install side-by-side (different applicationIds: `com.gadget` vs `com.gadget.root`).
          files: |
            artifacts/standard-debug-apk/*.apk
            artifacts/standard-release-apk/*.apk
            artifacts/standard-release-aab/*.aab
            artifacts/rooted-debug-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Detekt (both flavors)
        run: ./gradlew detekt
        continue-on-error: true
      - name: ktlint (both flavors)
        run: ./gradlew ktlintCheck
        continue-on-error: true
