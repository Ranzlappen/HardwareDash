name: Build Signed Release APK

on:
  workflow_dispatch:        # Manual trigger from browser
  push:
    branches: [ main ]     # Or whatever your default branch is

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 -d > HardwareDash-release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/HardwareDash-release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HardwareDash-release-apk
          path: app/build/outputs/apk/release/*.apk
