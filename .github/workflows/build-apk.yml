name: Build (debug, auto on main)

# Auto-triggered debug build matrix. Runs only on pushes to main.
# Produces both debug flavors and cuts a GitHub Release with them attached.
#
# Companion workflows:
#   * build-release.yml — manual workflow_dispatch only, produces signed
#     standard/rooted-release APKs + standard-release AAB and a separate
#     GitHub Release.
#   * ci-refactor.yml — PR fast feedback (debug build, no Release).
#
# Quality gates (leak-gate, libsu assertion, lint/detekt) live here because
# every commit landing on main passes through this workflow; the manual
# signed-release workflow trusts that gate and is build-only.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - '.gitattributes'
      - '.idea/**'
      - 'docs/**'
      - 'app/src/test/**'
      - 'app/src/androidTest/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: standard
            buildType: release
            assembleTask: "assembleStandardDebug assembleStandardRelease"
            outputDir: app/build/outputs/apk/standard/debug
            releaseOutputDir: app/build/outputs/apk/standard/release
            artifactName: standard-release
          - flavor: rooted
            buildType: release
            assembleTask: "assembleRootedDebug assembleRootedRelease"
            outputDir: app/build/outputs/apk/rooted/debug
            releaseOutputDir: app/build/outputs/apk/rooted/release
            artifactName: rooted-release
            extraGradleProps: "-PenableLsposedModule=true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Prepare build metadata
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "BUILD_COMMIT=${{ github.sha }}" >> $GITHUB_ENV
          echo "BUILD_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "BUILD_AUTHOR=${{ github.actor }}" >> $GITHUB_ENV
          echo "APP_DESCRIPTION=Gadget — monitor and control device sensors, camera, audio, and more" >> $GITHUB_ENV

      # Sign release APKs with the same production keystore that
      # build-release.yml uses (secrets.KEYSTORE). The previous setup
      # generated a fresh AGP debug keystore on every CI run via
      # `keytool -genkey`, which gave each release APK a different
      # signing certificate — Android refused the update from v140 to
      # v141 with "App not installed as package conflicts with an
      # existing package". Reusing the stable production cert means
      # every auto-built APK and every manual-release APK share one
      # signing key, so updates flow between any signed builds.
      - name: Decode production keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 -d > "${{ github.workspace }}/Gadget-release.jks"

      # Assemble both build types in one Gradle invocation (single config
      # phase). The debug APK is built so the leak gate / libsu assertion
      # can inspect a non-minified dex layout; only the release APK ships
      # as the GitHub Release attachment. Release is signed with the
      # production keystore from secrets.KEYSTORE — identical to the
      # manual build-release.yml workflow.
      - name: Build debug + R8-minified release (${{ matrix.flavor }})
        run: |
          ./gradlew ${{ matrix.assembleTask }} \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/Gadget-release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -PCI_VERSION_CODE=${{ env.VERSION_CODE }} \
            -PCI_VERSION_NAME=${{ env.VERSION_NAME }} \
            -PBUILD_AUTHOR="${{ env.BUILD_AUTHOR }}" \
            -PBUILD_DATE="${{ env.BUILD_DATE }}" \
            -PBUILD_COMMIT=${{ env.BUILD_COMMIT }} \
            -PBUILD_BRANCH=${{ env.BUILD_BRANCH }} \
            -PAPP_DESCRIPTION="${{ env.APP_DESCRIPTION }}" \
            ${{ matrix.extraGradleProps }}

      # ─── Standard-APK leakage assertion (debug + release) ───────────────
      # Belt-and-suspenders check that the standard APK does not bundle any
      # rooted assets, libsu strings, the LSPosed module, or root-tier
      # permissions. Source-set scoping in AGP makes this impossible by
      # construction, but this step catches accidents (e.g. someone moves
      # a file from src/rooted/ to src/main/). On hit, the offending
      # strings/assets/permissions are printed and the step emits a
      # ::error:: annotation so the failure surfaces inline on the PR diff.
      #
      # Scans BOTH the debug APK and the R8-minified release APK so an
      # R8/shrinker reshuffle can't sneak rooted bytes into the release
      # build (release dex layout differs from debug). Matches the
      # CLAUDE.md invariant that the gate runs on both assemble outputs.
      #
      # Implementation note: dex and AndroidManifest.xml are extracted via
      # `unzip -p` and inspected with `strings`. We deliberately AVOID
      # `aapt dump permissions` here — its path is not stable across
      # GitHub-hosted runner images and silent fail-open was the bug that
      # an earlier version of this gate shipped with.
      - name: Assert standard APK has no rooted leakage (debug + release)
        if: matrix.flavor == 'standard'
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          scan_apk() {
            local APK="$1"
            local LABEL="$2"
            echo "── Inspecting ${LABEL}: ${APK} ──"

            local WORK
            WORK=$(mktemp -d)

            unzip -p "$APK" '*.dex' > "$WORK/dexes.bin" 2>/dev/null || true
            test -s "$WORK/dexes.bin" || fail "Could not extract any dex from $APK"

            unzip -p "$APK" AndroidManifest.xml > "$WORK/manifest.bin" 2>/dev/null || true
            test -s "$WORK/manifest.bin" || fail "Could not extract AndroidManifest.xml from $APK"

            local HITS
            HITS=$(strings -a -n 6 "$WORK/dexes.bin" \
              | grep -iE 'topjohnwu|libsu|/system/(bin|xbin)/su|chainfire|hiddenapibypass|me\.weishu\.kernelsu|me\.bmax\.apatch|org\.lsposed\.|/data/adb/(magisk|modules|ksu)' \
              | sort -u || true)
            if [ -n "$HITS" ]; then
              echo "${LABEL} APK contains rooted strings:"
              echo "$HITS"
              fail "${LABEL} APK contains rooted strings (see above)"
            fi

            local ASSETS
            ASSETS=$(unzip -l "$APK" | awk '{print $NF}' \
              | grep -iE 'lsposed|magisk|spoofer|\.magisk\.|/su/|/ksu/|kernelsu|apatch' || true)
            if [ -n "$ASSETS" ]; then
              echo "${LABEL} APK contains rooted assets:"
              echo "$ASSETS"
              fail "${LABEL} APK contains rooted assets (see above)"
            fi

            {
              strings -a -n 8 "$WORK/manifest.bin"
              tr -d '\0' < "$WORK/manifest.bin" | strings -a -n 8
              strings -a -e l -n 8 "$WORK/manifest.bin"
            } > "$WORK/manifest.txt"
            echo "Manifest text extraction: $(wc -l < "$WORK/manifest.txt") lines"

            local PERMS
            PERMS=$(grep -iE 'WRITE_SECURE_SETTINGS|MOUNT_UNMOUNT|INSTALL_PACKAGES|DELETE_PACKAGES|READ_LOGS|MANAGE_USERS|CHANGE_CONFIGURATION|MASTER_CLEAR|REBOOT|ACCESS_SUPERUSER' "$WORK/manifest.txt" \
              | sort -u || true)
            if [ -n "$PERMS" ]; then
              echo "${LABEL} APK declares root-tier permissions:"
              echo "$PERMS"
              fail "${LABEL} APK declares root-tier permissions (see above)"
            fi

            rm -rf "$WORK"
            echo "✅ ${LABEL} APK clean — no rooted leakage detected"
          }

          DEBUG_APK=$(find ${{ matrix.outputDir }} -name "*.apk" -print -quit)
          test -n "$DEBUG_APK" || fail "No standard debug APK produced in ${{ matrix.outputDir }}"
          scan_apk "$DEBUG_APK" "standard-debug"

          RELEASE_APK=$(find ${{ matrix.releaseOutputDir }} -name "*.apk" -print -quit)
          test -n "$RELEASE_APK" || fail "No standard release APK produced in ${{ matrix.releaseOutputDir }}"
          scan_apk "$RELEASE_APK" "standard-release"

      # ─── Rooted-APK asset inventory (positive verification) ─────────────
      - name: Inventory rooted APK assets
        if: matrix.flavor == 'rooted'
        run: |
          set -euo pipefail
          APK=$(find ${{ matrix.outputDir }} -name "*.apk" -print -quit)
          test -n "$APK" || { echo "::error::No rooted APK produced in ${{ matrix.outputDir }}"; exit 1; }
          echo "Rooted APK: $APK"
          echo "Bundled asset/*.apk and lsposed-related entries:"
          unzip -l "$APK" \
            | awk '$NF ~ /^assets\/.*\.apk$/ || tolower($NF) ~ /lsposed|spoofer/ {print "  "$NF" ("$1" bytes)"}' \
            || true

      # ─── Rooted-APK libsu presence assertion ────────────────────────────
      - name: Assert rooted APK contains expected libsu signature
        if: matrix.flavor == 'rooted'
        run: |
          set -euo pipefail
          APK=$(find ${{ matrix.outputDir }} -name "*.apk" -print -quit)
          test -n "$APK" || { echo "::error::No rooted APK produced in ${{ matrix.outputDir }}"; exit 1; }
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          unzip -p "$APK" '*.dex' > "$WORK/dexes.bin" 2>/dev/null || true
          test -s "$WORK/dexes.bin" || { echo "::error::Could not extract dex from rooted APK"; exit 1; }
          strings -a -n 6 "$WORK/dexes.bin" \
            | grep -qiE 'topjohnwu|libsu' \
            || { echo "::error::Rooted APK missing libsu — rooted source set may be broken"; exit 1; }
          echo "✅ Rooted APK contains libsu signature"

      # Upload only the R8-minified release APK — the debug APK exists on
      # disk for the leak gate / libsu assertion but is intentionally not
      # persisted. retention-days: 1 keeps the artifact only as long as
      # the release job needs to attach it to the GitHub Release; the
      # Release asset is the durable record.
      - name: Upload R8-minified release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}-apk
          path: ${{ matrix.releaseOutputDir }}/*.apk
          retention-days: 1

      # Stash the standard-debug APK as a longer-lived baseline so the PR
      # CI's APK-size delta step can compare a PR's debug build against
      # the latest main-branch debug build of the same flavor. Debug-vs-
      # debug keeps the comparison apples-to-apples (R8 disabled both
      # sides). 14 days is enough to weather a quiet weekend on main.
      - name: Upload standard debug APK (size baseline)
        if: matrix.flavor == 'standard'
        uses: actions/upload-artifact@v4
        with:
          name: standard-debug-apk
          path: ${{ matrix.outputDir }}/*.apk
          retention-days: 14

  # ─── GitHub Release (R8-minified release APKs attached) ───────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List downloaded artifacts (diagnostic)
        run: |
          echo "Artifact tree:"
          find artifacts/ -type f -printf '  %p (%s bytes)\n'

      - name: Create GitHub Release with R8-minified release builds
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Gadget v1.0.${{ github.run_number }}
          body: |
            **Build:** #${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Author:** ${{ github.actor }}

            ## Downloads

            R8-minified release APKs for both flavors, signed with the
            production keystore (same cert as the manual
            **Build signed release (manual)** workflow). Updates flow
            cleanly between every auto-built and manual-built APK.

            - `Gadget-standard-v1.0.${{ github.run_number }}-release.apk` — non-rooted **release** build (R8-minified, production-signed).
            - `Gadget-rooted-v1.0.${{ github.run_number }}-release.apk` — **rooted** release build (R8-minified, production-signed). Requires Magisk / KernelSU / APatch.

            Standard and rooted APKs install side-by-side (different applicationIds: `dev.ranzlappen.gadget` vs `dev.ranzlappen.gadget.rooted`).
          files: |
            artifacts/standard-release-apk/*.apk
            artifacts/rooted-release-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Assert no legacy com.gadget.* imports in modular code
        # New modular code (:core:* / :feature:*) must never import the
        # legacy com.gadget.* namespace — that coupling is exactly what the
        # modular refactor exists to remove. Legacy code lives only in :app
        # (app/src/main + the standard/rooted flavor source sets), which is
        # not scanned here. A hit means a feature/core file reached back into
        # the monolith; scope the dependency through a :core seam instead.
        run: |
          set -euo pipefail
          if grep -rn --include='*.kt' 'import com\.gadget\.' core/ feature/; then
            echo "::error::Modular code (core/ or feature/) imports the legacy com.gadget.* namespace. Route the dependency through a :core module instead."
            exit 1
          fi
          echo "OK — no legacy com.gadget.* imports in core/ or feature/."
      - name: Detekt (both flavors)
        run: ./gradlew detekt
        continue-on-error: true
      - name: ktlint (both flavors)
        run: ./gradlew ktlintCheck
        continue-on-error: true
