name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - '.gitattributes'
      - '.idea/**'
      - '.github/**'
      - 'docs/**'
      - 'app/src/test/**'
      - 'app/src/androidTest/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 -d > HardwareDash-release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Prepare build metadata
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "BUILD_COMMIT=${{ github.sha }}" >> $GITHUB_ENV
          echo "BUILD_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "BUILD_AUTHOR=${{ github.actor }}" >> $GITHUB_ENV
          echo "APP_DESCRIPTION=Hardware Dashboard — monitor and control device sensors, camera, audio, and more" >> $GITHUB_ENV

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/HardwareDash-release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -PCI_VERSION_CODE=${{ env.VERSION_CODE }} \
            -PCI_VERSION_NAME=${{ env.VERSION_NAME }} \
            -PBUILD_AUTHOR="${{ env.BUILD_AUTHOR }}" \
            -PBUILD_DATE="${{ env.BUILD_DATE }}" \
            -PBUILD_COMMIT=${{ env.BUILD_COMMIT }} \
            -PBUILD_BRANCH=${{ env.BUILD_BRANCH }} \
            -PAPP_DESCRIPTION="${{ env.APP_DESCRIPTION }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HardwareDash-v${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/*.apk

      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: HardwareDash v${{ env.VERSION_NAME }}
          body: |
            **Build:** #${{ github.run_number }}
            **Commit:** ${{ env.BUILD_COMMIT }}
            **Branch:** ${{ env.BUILD_BRANCH }}
            **Author:** ${{ env.BUILD_AUTHOR }}
            **Date:** ${{ env.BUILD_DATE }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
