name: Build Variants

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - '.gitattributes'
      - '.idea/**'
      - 'docs/**'
      - 'app/src/test/**'
      - 'app/src/androidTest/**'

# A single workflow with a matrix over (flavor, buildType). Each leg is
# independent: a rooted-only compile failure cannot block the standard APK,
# and vice versa. Source-set scoping (src/standard/ vs src/rooted/) is
# enforced by AGP, NOT by deleting files in CI — never `rm -rf src/rooted/`
# from this workflow, it would race with the Gradle build cache.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: standard
            buildType: debug
            assembleTask: assembleStandardDebug
            outputDir: app/build/outputs/apk/standard/debug
            artifactName: standard-debug
            needsSigning: false
          - flavor: standard
            buildType: release
            assembleTask: "assembleStandardRelease bundleStandardRelease"
            outputDir: app/build/outputs/apk/standard/release
            bundleDir: app/build/outputs/bundle/standardRelease
            artifactName: standard-release
            needsSigning: true
          - flavor: rooted
            buildType: debug
            assembleTask: assembleRootedDebug
            outputDir: app/build/outputs/apk/rooted/debug
            artifactName: rooted-debug
            needsSigning: false
            extraGradleProps: "-PenableLsposedModule=true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode Keystore
        if: matrix.needsSigning
        run: echo "${{ secrets.KEYSTORE }}" | base64 -d > Gadget-release.jks

      - name: Prepare build metadata
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "BUILD_COMMIT=${{ github.sha }}" >> $GITHUB_ENV
          echo "BUILD_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "BUILD_AUTHOR=${{ github.actor }}" >> $GITHUB_ENV
          echo "APP_DESCRIPTION=Gadget — monitor and control device sensors, camera, audio, and more" >> $GITHUB_ENV

      # Signed release builds (standard-release only in this workflow).
      - name: Build signed release (${{ matrix.flavor }})
        if: matrix.needsSigning
        run: |
          ./gradlew ${{ matrix.assembleTask }} \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/Gadget-release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -PCI_VERSION_CODE=${{ env.VERSION_CODE }} \
            -PCI_VERSION_NAME=${{ env.VERSION_NAME }} \
            -PBUILD_AUTHOR="${{ env.BUILD_AUTHOR }}" \
            -PBUILD_DATE="${{ env.BUILD_DATE }}" \
            -PBUILD_COMMIT=${{ env.BUILD_COMMIT }} \
            -PBUILD_BRANCH=${{ env.BUILD_BRANCH }} \
            -PAPP_DESCRIPTION="${{ env.APP_DESCRIPTION }}"

      # Debug builds — AGP-managed debug keystore, no signing properties needed.
      - name: Build debug (${{ matrix.flavor }})
        if: ${{ !matrix.needsSigning }}
        run: |
          ./gradlew ${{ matrix.assembleTask }} \
            -PCI_VERSION_CODE=${{ env.VERSION_CODE }} \
            -PCI_VERSION_NAME=${{ env.VERSION_NAME }} \
            -PBUILD_AUTHOR="${{ env.BUILD_AUTHOR }}" \
            -PBUILD_DATE="${{ env.BUILD_DATE }}" \
            -PBUILD_COMMIT=${{ env.BUILD_COMMIT }} \
            -PBUILD_BRANCH=${{ env.BUILD_BRANCH }} \
            -PAPP_DESCRIPTION="${{ env.APP_DESCRIPTION }}" \
            ${{ matrix.extraGradleProps }}

      # ─── Standard-APK leakage assertion ──────────────────────────────────
      # Belt-and-suspenders check that the standard APK does not bundle any
      # rooted assets, libsu strings, the LSPosed module, or root-tier
      # permissions. Source-set scoping in AGP makes this impossible by
      # construction, but this step catches accidents (e.g. someone moves
      # a file from src/rooted/ to src/main/). On hit, the offending
      # strings/assets/permissions are printed and the step emits a
      # ::error:: annotation so the failure surfaces inline on the PR diff.
      #
      # Implementation note: dex and AndroidManifest.xml are extracted via
      # `unzip -p` and inspected with `strings`. We deliberately AVOID
      # `aapt dump permissions` here — its path is not stable across
      # GitHub-hosted runner images and silent fail-open was the bug that
      # an earlier version of this gate shipped with.
      - name: Assert standard APK has no rooted leakage
        if: matrix.flavor == 'standard'
        run: |
          set -euo pipefail
          APK=$(find ${{ matrix.outputDir }} -name "*.apk" -print -quit)
          test -n "$APK" || { echo "::error::No standard APK produced in ${{ matrix.outputDir }}"; exit 1; }
          echo "Inspecting: $APK"

          fail() { echo "::error::$1"; exit 1; }

          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT

          # Extract every dex (matched by archive-internal glob) plus the
          # binary AndroidManifest.xml. If either comes back empty, the APK
          # is malformed or unzip is not behaving — bail loudly rather than
          # passing the gate by accident.
          unzip -p "$APK" '*.dex' > "$WORK/dexes.bin" 2>/dev/null || true
          test -s "$WORK/dexes.bin" || fail "Could not extract any dex from $APK"

          unzip -p "$APK" AndroidManifest.xml > "$WORK/manifest.bin" 2>/dev/null || true
          test -s "$WORK/manifest.bin" || fail "Could not extract AndroidManifest.xml from $APK"

          # 1. No su-related strings in any dex.
          HITS=$(strings -a -n 6 "$WORK/dexes.bin" \
            | grep -iE 'topjohnwu|libsu|/system/(bin|xbin)/su|chainfire|magisk|superuser|hiddenapibypass' \
            | sort -u || true)
          if [ -n "$HITS" ]; then
            echo "Standard APK contains rooted strings:"
            echo "$HITS"
            fail "Standard APK contains rooted strings (see above)"
          fi

          # 2. No rooted asset filenames bundled inside the APK.
          ASSETS=$(unzip -l "$APK" | awk '{print $NF}' \
            | grep -iE 'lsposed|magisk|spoofer|\.magisk\.|/su/' || true)
          if [ -n "$ASSETS" ]; then
            echo "Standard APK contains rooted assets:"
            echo "$ASSETS"
            fail "Standard APK contains rooted assets (see above)"
          fi

          # 3. No root-tier permissions. The binary AndroidManifest.xml stores
          #    permission names as plain UTF-8 strings in its string-pool; a
          #    single `strings | grep` reliably surfaces them.
          PERMS=$(strings -a -n 8 "$WORK/manifest.bin" \
            | grep -iE 'WRITE_SECURE_SETTINGS|MOUNT_UNMOUNT|INSTALL_PACKAGES|DELETE_PACKAGES|READ_LOGS|MANAGE_USERS|CHANGE_CONFIGURATION|MASTER_CLEAR|REBOOT|ACCESS_SUPERUSER' \
            | sort -u || true)
          if [ -n "$PERMS" ]; then
            echo "Standard APK declares root-tier permissions:"
            echo "$PERMS"
            fail "Standard APK declares root-tier permissions (see above)"
          fi

          echo "✅ Standard APK clean — no rooted leakage detected"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}-apk
          path: ${{ matrix.outputDir }}/*.apk

      - name: Upload AAB artifact (Play Store)
        if: matrix.flavor == 'standard' && matrix.buildType == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}-aab
          path: ${{ matrix.bundleDir }}/*.aab

      # GitHub Release attachment runs only for the standard-release leg on main.
      - name: Create Release & Upload APK
        if: |
          matrix.flavor == 'standard' &&
          matrix.buildType == 'release' &&
          github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Gadget v${{ env.VERSION_NAME }}
          body: |
            **Build:** #${{ github.run_number }}
            **Commit:** ${{ env.BUILD_COMMIT }}
            **Branch:** ${{ env.BUILD_BRANCH }}
            **Author:** ${{ env.BUILD_AUTHOR }}
            **Date:** ${{ env.BUILD_DATE }}
          files: |
            ${{ matrix.outputDir }}/*.apk
            ${{ matrix.bundleDir }}/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Detekt (both flavors)
        run: ./gradlew detekt
        continue-on-error: true
      - name: ktlint (both flavors)
        run: ./gradlew ktlintCheck
        continue-on-error: true
