# Robolectric config for the Roborazzi preview-render pass.
#
# sdk=34 (Android 14): the most battle-tested Robolectric SDK level for
# Compose screenshot rendering. compileSdk is 35 and Robolectric 4.14
# supports 35, but 34 avoids the freshest-SDK resource/graphics edge cases —
# raise to 35 only if a screen needs an Android-15-only API to render.
sdk=34

# NATIVE graphics is required for pixel-accurate Compose captures (gradients,
# the glassmorphic surfaces, M3 elevation). It is the Robolectric 4.10+
# default; pinned here so a future default change can't silently blank the
# gallery.
graphicsMode=NATIVE
