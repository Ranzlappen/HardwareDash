plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.hardwaredash'
    compileSdk 35

    defaultConfig {
        applicationId "com.hardwaredash"
        minSdk 29            // Android 10 — covers Huawei P30
        targetSdk 35         // Android 15 — targets Xiaomi 14T Pro
        versionCode project.hasProperty('CI_VERSION_CODE') ? project.property('CI_VERSION_CODE').toInteger() : 1
        versionName project.hasProperty('CI_VERSION_NAME') ? project.property('CI_VERSION_NAME') : "1.0-dev"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables { useSupportLibrary true }

        // Build metadata (injected by CI, defaults for local dev)
        buildConfigField "String", "BUILD_AUTHOR", "\"${project.findProperty('BUILD_AUTHOR') ?: 'local'}\""
        buildConfigField "String", "BUILD_DATE", "\"${project.findProperty('BUILD_DATE') ?: 'unknown'}\""
        buildConfigField "String", "BUILD_COMMIT", "\"${project.findProperty('BUILD_COMMIT') ?: 'unknown'}\""
        buildConfigField "String", "BUILD_BRANCH", "\"${project.findProperty('BUILD_BRANCH') ?: 'unknown'}\""
        buildConfigField "String", "APP_DESCRIPTION", "\"${project.findProperty('APP_DESCRIPTION') ?: 'Hardware Dashboard — monitor and control device sensors, camera, audio, and more'}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions { kotlinCompilerExtensionVersion '1.5.0' }

    packaging {
        resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "HardwareDash-v${variant.versionName}-release.apk"
        }
    }
}

dependencies {
    // Compose BOM — keeps all Compose versions in sync
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.6'

    // CameraX
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
    implementation 'androidx.camera:camera-video:1.3.1'

    // Accompanist permissions helper
    implementation 'com.google.accompanist:accompanist-permissions:0.32.0'

    // ViewModel + Compose integration
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // WorkManager (widget periodic updates + Ticked reminders)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Ticked: serialization + DataStore
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0'
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // GPS (FusedLocationProvider)
    implementation 'com.google.android.gms:play-services-location:21.1.0'

    // Map (OSMDroid — no API key needed)
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

    // EXIF metadata editing for images
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    // Test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
