build:
  maxIssues: 0

complexity:
  LongMethod:
    # NFC write-protection detection paths (RadiosScreen.detectWriteProtection)
    # are inherently long state machines that map raw byte sequences to
    # vendor-specific protection schemes; XmlPullParser-based parsers
    # similarly accumulate state. 250 catches genuinely overgrown methods
    # without flagging these well-understood vertical state machines.
    threshold: 250
    ignoreAnnotated:
      - 'Composable'
  LongParameterList:
    # Material3 ColorScheme builders take 8+ palette params; LocationAdapter
    # mirrors android.location.Location's setter surface (10 fields).
    functionThreshold: 12
    constructorThreshold: 12
    ignoreAnnotated:
      - 'Composable'
  TooManyFunctions:
    # Hilt EntryPoint interfaces enumerate every controller (26+);
    # Room DAOs enumerate every query (33+); centralized localization
    # objects (Strings.S.Services) enumerate every string in a feature
    # block. None of these are refactor candidates.
    thresholdInFiles: 50
    thresholdInClasses: 50
    thresholdInInterfaces: 50
    thresholdInObjects: 50
    ignoreAnnotated:
      - 'Composable'
  CyclomaticComplexMethod:
    # NFC vendor-specific write-protection detection
    # (RadiosScreen.detectWriteProtection) is one giant `when` chain
    # mapping raw byte sequences to schemes — complexity 67. 70 captures
    # this without hiding genuinely bad code.
    threshold: 70
    ignoreAnnotated:
      - 'Composable'
  NestedBlockDepth:
    # XmlPullParser state machines and NFC byte-protocol decoders
    # naturally nest beyond detekt's default 4.
    threshold: 8
  ComplexCondition:
    # 4-clause boolean conditions are common in NFC password-bypass and
    # autocomplete debouncing logic.
    threshold: 5
  LargeClass:
    # RootFeatureRegistry maps every RootFeatureKey (~70) to a descriptor
    # in one place — splitting it would obscure the single source of truth.
    threshold: 1500

style:
  MagicNumber:
    active: false
  ReturnCount:
    # Guard-clause-heavy launchers routinely have 6-9 early returns;
    # single-return rewrites bury the happy path.
    max: 9
  ThrowsCount:
    # XmlPullParser parsers throw 3 distinct kinds (acquire, malformed,
    # too-few-points). Bumping by 2 covers them without hiding genuinely
    # over-throwing functions.
    max: 4
  MaxLineLength:
    # Compose UI screens routinely have long modifier chains; localization
    # files contain raw user-facing content that can exceed any reasonable
    # column limit. Real code-quality issues remain caught at 240.
    maxLineLength: 240
    excludeCommentStatements: true
    excludes:
      - '**/localization/**'
  ForbiddenComment:
    active: false
  UnusedPrivateMember:
    active: true
    ignoreAnnotated:
      - 'Preview'
      - 'Composable'
  WildcardImport:
    # Compose-heavy screens import 20+ symbols from material3, foundation.layout,
    # etc. Forcing explicit imports adds 50+ noise lines per screen with no
    # readability win. ktlint enforces no-wildcards on a separate path; this
    # keeps detekt's strict-zero-issues mode usable.
    active: false

performance:
  ForEachOnRange:
    # Project-wide convention is `(0 until n).forEach { … }` for short
    # range iterations; the perf delta is negligible at our scales.
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
  TopLevelPropertyNaming:
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'
  MatchingDeclarationName:
    # Many files in this codebase host a small cluster of related top-level
    # decls under a feature-themed file name (e.g. NavGraph.kt → Routes;
    # NfcExtremeMode.kt → RawNciCommandConfig). Renaming each file to match
    # its first-listed decl would scatter related code.
    active: false
  MemberNameEqualsClassName:
    # Localization classes intentionally have e.g. S.Backup.backup get() as
    # the canonical "the localized noun" — renaming would force every call
    # site to invent a synonym.
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
