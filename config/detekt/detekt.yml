build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 100
    ignoreAnnotated:
      - 'Composable'
  LongParameterList:
    # ColorPresets buildDark/Light/HcDark/HcLight each take exactly 8 colour
    # parameters — that is the intentional Material-3 colour-builder shape.
    functionThreshold: 10
    constructorThreshold: 10
    ignoreAnnotated:
      - 'Composable'
  TooManyFunctions:
    # DAOs, Hilt entry points, and localization objects naturally enumerate many
    # members. The file/class limits are raised to avoid flagging intentional
    # data-table shapes while still catching genuine god-objects.
    thresholdInFiles: 35
    thresholdInClasses: 45
    ignoreAnnotated:
      - 'Composable'
  CyclomaticComplexMethod:
    threshold: 20
    ignoreAnnotated:
      - 'Composable'

style:
  MagicNumber:
    active: false
  ReturnCount:
    # RadiosScreen.attemptPasswordBypass has 9 legitimate early-return guard
    # clauses. The NFC write-protection logic warrants this many exits.
    max: 9
  MaxLineLength:
    maxLineLength: 140
    excludeCommentStatements: true
    excludes:
      # Localization strings legitimately contain multi-language translations on
      # one line that can exceed 600 characters; line-wrapping them gives no
      # readability benefit.
      - '**/localization/**'
  WildcardImport:
    # Compose screens routinely import 20+ symbols per package (foundation,
    # material3, runtime, icons). Expanding to explicit imports adds ~50 noise
    # lines per screen with no correctness benefit.
    active: false
  MatchingDeclarationName:
    # Many files host clusters of related top-level declarations under a
    # feature-themed filename (e.g. NavGraph.kt → Routes).
    active: false
  MemberNameEqualsClassName:
    # The localization API intentionally uses S.Backup.backup get() and
    # S.Search.search get() as the readable call-site form.
    active: false
  ForbiddenComment:
    active: false
  UnusedPrivateMember:
    active: true
    ignoreAnnotated:
      - 'Preview'
      - 'Composable'

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
  TopLevelPropertyNaming:
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

potential-bugs:
  # (0 until n).forEach { } is idiomatic Kotlin in this codebase; the
  # performance delta versus an index loop is negligible.
  ForEachOnRange:
    active: false
