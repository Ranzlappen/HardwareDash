build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 100
    ignoreAnnotated:
      - 'Composable'
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreAnnotated:
      - 'Composable'
  TooManyFunctions:
    thresholdInFiles: 30
    thresholdInClasses: 25
    ignoreAnnotated:
      - 'Composable'
  CyclomaticComplexMethod:
    threshold: 20
    ignoreAnnotated:
      - 'Composable'

style:
  MagicNumber:
    active: false
  ReturnCount:
    # Guard-clause-heavy launchers (e.g. AppLauncher.launch) routinely have
    # 6-8 early returns. Single-return rewrites bury the happy path.
    max: 8
  MaxLineLength:
    # Compose UI screens routinely have long modifier chains; localization
    # files contain raw user-facing content that can exceed any reasonable
    # column limit. Real code-quality issues remain caught at 240.
    maxLineLength: 240
    excludeCommentStatements: true
    excludes:
      - '**/localization/**'
  ForbiddenComment:
    active: false
  UnusedPrivateMember:
    active: true
    ignoreAnnotated:
      - 'Preview'
      - 'Composable'
  WildcardImport:
    # Compose-heavy screens import 20+ symbols from material3, foundation.layout,
    # etc. Forcing explicit imports adds 50+ noise lines per screen with no
    # readability win. ktlint enforces no-wildcards on a separate path; this
    # keeps detekt's strict-zero-issues mode usable.
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
  TopLevelPropertyNaming:
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
